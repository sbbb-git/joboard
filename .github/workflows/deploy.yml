name: deploy

# Build and deploy the site on every push to main (and on demand).
#
# The job board and its scraper were retired in 2026-09: the site now
# publishes guides only, so there is nothing to refresh on a schedule. No
# cron, no scrape, no commit back to the repo, hence read-only permissions.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Generate llms.txt + llms-full.txt
        run: node scripts/gen_llms.mjs

      - name: Build static site
        env:
          SITE_URL: https://slateremote.com
          NEXT_PUBLIC_CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
        run: npm run build

      - name: Patch <html lang> per locale
        run: node scripts/fix_html_lang.mjs

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler@latest pages deploy out --project-name=slateremote --branch=main --commit-dirty=true

      - name: Ping IndexNow
        if: success()
        continue-on-error: true
        env:
          SITE_URL: https://slateremote.com
          INDEXNOW_KEY: 1cb9f8a61b957eb23ab2e38131576cd2
        run: |
          set -uo pipefail
          if [ ! -f out/sitemap.xml ]; then
            echo "No sitemap.xml found, skipping IndexNow ping"
            exit 0
          fi
          urls=$(grep -oP '(?<=<loc>)[^<]+' out/sitemap.xml 2>/dev/null | head -10000 || true)
          if [ -z "$urls" ]; then
            echo "No URLs in sitemap, skipping"
            exit 0
          fi
          count=$(echo "$urls" | wc -l)
          echo "Submitting $count URLs to IndexNow (batches of 10)"
          echo "$urls" | split -l 10 - /tmp/indexnow-batch-
          for f in /tmp/indexnow-batch-*; do
            urlList=$(jq -R -s -c 'split("\n") | map(select(length > 0))' < "$f")
            payload=$(jq -n --arg host "slateremote.com" --arg key "$INDEXNOW_KEY" --arg keyLocation "$SITE_URL/$INDEXNOW_KEY.txt" --argjson urlList "$urlList" \
              '{host: $host, key: $key, keyLocation: $keyLocation, urlList: $urlList}')
            code=$(curl -s -o /tmp/indexnow.out -w "%{http_code}" -X POST 'https://api.indexnow.org/indexnow' \
              -H 'content-type: application/json' \
              -d "$payload" || echo "000")
            echo "  batch $(basename $f): HTTP $code"
          done
